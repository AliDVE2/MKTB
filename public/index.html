<title>مكتب المهندس</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --p:#F97316;          /* اللون الاساسي البرتقالي - يتغير من الاعدادات */
  --p-soft:rgba(249,115,22,.14);
  --ink:#050505;        /* الاسود */
  --bg:#0a0a0b;
  --s1:#121214;
  --s2:#19191c;
  --line:#2a2a2f;
  --tx:#f4f4f5;
  --mu:#9a9aa3;
  --ok:#22c55e; --bad:#ef4444; --warn:#eab308;
  --r:14px;
  --top:calc(env(safe-area-inset-top,0px));
  --bot:calc(env(safe-area-inset-bottom,0px));
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Cairo',Tahoma,'Segoe UI',sans-serif;background:var(--bg);color:var(--tx);font-size:15px;line-height:1.6;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}
svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid var(--p);outline-offset:2px}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#333;border-radius:8px}

/* ===== الشعار: برتقالي بحواف سوداء ===== */
.logo{display:inline-flex;align-items:center;gap:10px}
.logo-mark{background:var(--p);color:var(--ink);border:3px solid var(--ink);box-shadow:0 0 0 2px var(--p),0 6px 18px rgba(249,115,22,.35);border-radius:12px;padding:2px 14px;font-weight:900;font-size:19px;letter-spacing:.2px;white-space:nowrap}
.logo-mark.big{font-size:30px;padding:6px 26px;border-width:4px;border-radius:16px}

/* ===== الهيدر ===== */
.top{position:sticky;top:0;z-index:30;background:rgba(10,10,11,.88);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:calc(10px + var(--top)) 14px 10px}
.top-in{max-width:1180px;margin:auto;display:flex;align-items:center;gap:10px}
.top-in .grow{flex:1;display:flex;justify-content:center}
.icon-btn{position:relative;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--s1);border:1px solid var(--line);transition:.15s}
.icon-btn:hover{border-color:var(--p);color:var(--p)}
.badge{position:absolute;top:-6px;left:-6px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--p);color:var(--ink);font-size:12px;font-weight:900;display:grid;place-items:center;border:2px solid var(--ink)}

/* ===== القائمة الجانبية ===== */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:.25s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;right:0;width:min(330px,86vw);background:var(--s1);border-left:1px solid var(--line);z-index:41;transform:translateX(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;padding:calc(18px + var(--top)) 16px calc(16px + var(--bot))}
.drawer.on{transform:none}
.d-user{margin:18px 0;padding:14px;border-radius:var(--r);background:var(--s2);border:1px solid var(--line)}
.d-user b{display:block;font-size:15px;overflow:hidden;text-overflow:ellipsis}
.d-user span{color:var(--mu);font-size:13px;word-break:break-all}
.role-tag{display:inline-block;margin-top:6px;padding:1px 10px;border-radius:20px;background:var(--p);color:var(--ink);font-size:12px;font-weight:700}
.nav-i{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border-radius:12px;color:var(--tx);font-weight:600;text-align:right;transition:.15s}
.nav-i:hover,.nav-i.act{background:var(--p-soft);color:var(--p)}
.d-foot{margin-top:auto;padding-top:12px;border-top:1px solid var(--line)}

/* ===== الصفحة ===== */
.wrap{max-width:1180px;margin:auto;padding:18px 14px calc(96px + var(--bot))}
h1.pg{font-size:24px;font-weight:900;margin-bottom:14px}
.hero{position:relative;overflow:hidden;border-radius:20px;border:3px solid var(--ink);background:linear-gradient(135deg,var(--p) 0%,#c2410c 100%);color:var(--ink);padding:26px 22px;margin-bottom:18px;box-shadow:0 0 0 2px var(--p)}
.hero h2{font-size:26px;font-weight:900;line-height:1.35}
.hero p{font-weight:600;margin-top:6px;max-width:520px}
.hero .btn{margin-top:14px}
.hero::after{content:"";position:absolute;left:-40px;bottom:-60px;width:220px;height:220px;border-radius:50%;border:34px solid rgba(0,0,0,.14)}
.search{display:flex;align-items:center;gap:10px;background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:0 14px;margin-bottom:12px}
.search:focus-within{border-color:var(--p)}
.search input{flex:1;background:none;border:0;outline:0;padding:13px 0}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:10px}
.chip{flex:none;padding:8px 16px;border-radius:30px;border:1px solid var(--line);background:var(--s1);font-weight:600;font-size:14px;transition:.15s}
.chip.on{background:var(--p);color:var(--ink);border-color:var(--ink);font-weight:800}

.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:960px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;transition:.2s}
.card:hover{border-color:var(--p);transform:translateY(-2px)}
.p-img{aspect-ratio:1/1;background:var(--s2);display:grid;place-items:center;color:#444;overflow:hidden}
.p-img img{width:100%;height:100%;object-fit:cover}
.p-img svg{width:44px;height:44px}
.p-b{padding:12px;display:flex;flex-direction:column;gap:6px;flex:1}
.p-cat{color:var(--mu);font-size:12px}
.p-n{font-weight:700;line-height:1.4;min-height:42px}
.p-pr{font-weight:900;color:var(--p);font-size:17px}
.p-pr small{color:var(--mu);font-weight:600;font-size:12px}
.p-a{display:flex;gap:6px;margin-top:auto;padding-top:6px}
.tag-out{color:var(--bad);font-weight:700;font-size:13px}

/* ===== ازرار وحقول ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:12px;font-weight:800;background:var(--p);color:var(--ink);border:2px solid var(--ink);box-shadow:0 0 0 1px var(--p);transition:.15s}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:scale(.98)}
.btn.sm{padding:8px 12px;font-size:14px}
.btn.ghost{background:var(--s2);color:var(--tx);border:1px solid var(--line);box-shadow:none}
.btn.ghost:hover{border-color:var(--p);color:var(--p)}
.btn.wa{background:#1fa855;color:#fff;border-color:#0b3d1f;box-shadow:none}
.btn.danger{background:transparent;color:var(--bad);border:1px solid rgba(239,68,68,.5);box-shadow:none}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;pointer-events:none}
.fld{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.fld label{font-size:13px;color:var(--mu);font-weight:600}
.in,select.in,textarea.in{width:100%;background:var(--s2);border:1px solid var(--line);border-radius:12px;padding:11px 13px;outline:0}
.in:focus{border-color:var(--p)}
textarea.in{min-height:90px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.msg{padding:10px 12px;border-radius:12px;font-size:14px;margin-bottom:12px}
.msg.err{background:rgba(239,68,68,.12);color:#fca5a5;border:1px solid rgba(239,68,68,.4)}
.msg.ok{background:rgba(34,197,94,.12);color:#86efac;border:1px solid rgba(34,197,94,.4)}
.msg.warn{background:rgba(234,179,8,.12);color:#fde68a;border:1px solid rgba(234,179,8,.4)}

/* ===== الاعدادات (واجهة مستقلة) ===== */
.set{display:grid;gap:14px}
@media(min-width:900px){.set{grid-template-columns:260px 1fr;align-items:start}}
.side{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:10px}
.side h4{color:var(--mu);font-size:12px;margin:10px 12px 4px;font-weight:700}
.side .nav-i{padding:10px 12px}
.side-scroll{display:flex;gap:6px;overflow-x:auto}
@media(max-width:899px){.side{display:flex;gap:6px;overflow-x:auto;padding:8px}.side h4{display:none}.side .nav-i{white-space:nowrap;width:auto}}
.panel{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.panel h3{font-size:19px;font-weight:800;margin-bottom:14px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
@media(min-width:700px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--s2);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stat span{color:var(--mu);font-size:13px}
.stat b{display:block;font-size:24px;font-weight:900;color:var(--p)}
.list{display:flex;flex-direction:column;gap:8px}
.li{display:flex;align-items:center;gap:12px;background:var(--s2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.li .grow{flex:1;min-width:0}
.li .grow b{display:block;overflow:hidden;text-overflow:ellipsis}
.li .grow small{color:var(--mu)}
.thumb{width:48px;height:48px;border-radius:10px;background:var(--s1);overflow:hidden;display:grid;place-items:center;flex:none;color:#555}
.thumb img{width:100%;height:100%;object-fit:cover}
.pill{display:inline-block;padding:2px 10px;border-radius:20px;font-size:12px;font-weight:700;background:var(--s1);border:1px solid var(--line)}
.pill.new{color:var(--p);border-color:var(--p)}.pill.done{color:var(--ok);border-color:var(--ok)}.pill.cancel{color:var(--bad);border-color:var(--bad)}.pill.proc{color:var(--warn);border-color:var(--warn)}
.empty{text-align:center;color:var(--mu);padding:34px 10px}
.empty svg{width:42px;height:42px;margin-bottom:8px;opacity:.6}

/* ===== السلة ===== */
.qty{display:flex;align-items:center;gap:2px;background:var(--s1);border:1px solid var(--line);border-radius:10px}
.qty button{width:34px;height:34px;display:grid;place-items:center;font-weight:900;font-size:18px}
.qty span{min-width:26px;text-align:center;font-weight:800}
.total{display:flex;justify-content:space-between;font-size:18px;font-weight:900;padding:14px 0}
.total b{color:var(--p)}

/* ===== دخول ===== */
.auth{min-height:100%;display:grid;place-items:center;padding:24px 16px;background:radial-gradient(900px 400px at 50% -10%,rgba(249,115,22,.22),transparent 70%)}
.auth-box{width:100%;max-width:420px}
.auth-box .logo{display:flex;justify-content:center;margin-bottom:8px}
.auth-sub{text-align:center;color:var(--mu);margin-bottom:22px}
.auth-card{background:var(--s1);border:1px solid var(--line);border-radius:20px;padding:22px}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--s2);border-radius:12px;padding:4px;margin-bottom:18px}
.tabs button{padding:9px;border-radius:9px;font-weight:700;color:var(--mu)}
.tabs button.on{background:var(--p);color:var(--ink)}
.link{color:var(--p);font-weight:700;font-size:14px}

/* ===== نافذة منبثقة ===== */
.modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.7);display:grid;place-items:end center;padding:0}
@media(min-width:700px){.modal{place-items:center;padding:20px}}
.m-box{width:100%;max-width:520px;max-height:92vh;overflow:auto;background:var(--s1);border:1px solid var(--line);border-radius:20px 20px 0 0;padding:20px 20px calc(20px + var(--bot))}
@media(min-width:700px){.m-box{border-radius:20px}}
.m-box h3{font-size:19px;font-weight:800;margin-bottom:14px}
.m-act{display:flex;gap:8px;margin-top:6px}
.m-act .btn{flex:1}

/* ===== واتساب عائم ===== */
.fab{position:fixed;left:16px;bottom:calc(18px + var(--bot));z-index:25;width:56px;height:56px;border-radius:50%;background:#1fa855;color:#fff;display:grid;place-items:center;border:3px solid var(--ink);box-shadow:0 8px 24px rgba(0,0,0,.5)}
.fab svg{width:28px;height:28px;fill:#fff;stroke:none}
.toast{position:fixed;right:50%;transform:translateX(50%);bottom:calc(90px + var(--bot));z-index:80;background:var(--tx);color:var(--ink);padding:10px 20px;border-radius:30px;font-weight:800;box-shadow:0 8px 24px rgba(0,0,0,.5);max-width:90vw}
.spin{width:34px;height:34px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--p);animation:sp .8s linear infinite;margin:auto}
@keyframes sp{to{transform:rotate(360deg)}}
.boot{height:100%;display:grid;place-items:center}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ===== شاشة الافتتاح ===== */
#splash{position:fixed;inset:0;z-index:999;background:#0a0a0b;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .5s ease, visibility .5s}
#splash::before{content:"";position:absolute;inset:0;background:radial-gradient(650px 420px at 50% 38%,rgba(249,115,22,.20),transparent 70%)}
#splash.out{opacity:0;visibility:hidden;pointer-events:none}
.sp-mark{position:relative;width:112px;height:112px;border-radius:28px;background:var(--p);border:4px solid var(--ink);box-shadow:0 0 0 2px var(--p),0 10px 34px rgba(249,115,22,.4);display:grid;place-items:center;animation:spPop .7s cubic-bezier(.2,.9,.25,1.3)}
.sp-mark svg{width:56px;height:56px}
.sp-mark .bolt{fill:var(--ink);stroke:none;animation:spFlash 2.2s ease-in-out .8s infinite}
.sp-ring{position:absolute;inset:-10px;border-radius:34px;border:2px solid var(--p);opacity:0;animation:spRing 2.2s ease-out .2s infinite}
.sp-name{position:relative;font-size:23px;font-weight:900;letter-spacing:.3px;opacity:0;animation:spIn .6s ease .35s forwards}
.sp-tag{position:relative;color:var(--mu);font-size:13px;font-weight:600;opacity:0;animation:spIn .6s ease .5s forwards}
.sp-dots{position:relative;display:flex;gap:6px;margin-top:6px}
.sp-dots span{width:7px;height:7px;border-radius:50%;background:var(--p);opacity:.35;animation:spDot 1.1s ease-in-out infinite}
.sp-dots span:nth-child(2){animation-delay:.15s}.sp-dots span:nth-child(3){animation-delay:.3s}
@keyframes spPop{0%{transform:scale(.4) rotate(-8deg);opacity:0}70%{transform:scale(1.08) rotate(2deg)}100%{transform:scale(1) rotate(0);opacity:1}}
@keyframes spRing{0%{transform:scale(.9);opacity:.6}100%{transform:scale(1.35);opacity:0}}
@keyframes spFlash{0%,100%{opacity:1}50%{opacity:.55}}
@keyframes spIn{to{opacity:1;transform:translateY(0)}from{transform:translateY(6px)}}
@keyframes spDot{0%,100%{opacity:.35;transform:translateY(0)}50%{opacity:1;transform:translateY(-4px)}}
@media(prefers-reduced-motion:reduce){.sp-mark,.sp-ring,.sp-name,.sp-tag,.sp-dots span{animation:none!important;opacity:1!important}}

/* ضغط الصورة قبل رفعها (تصغير الابعاد وتحويلها JPEG) حتى الرفع يصير اسرع ويوفر مساحة */
function compressImage(file, maxDim=1080, quality=.82){
  return new Promise((resolve,reject)=>{
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      let w=img.naturalWidth, h=img.naturalHeight;
      if(w>maxDim || h>maxDim){
        if(w>=h){ h=Math.round(h*maxDim/w); w=maxDim; } else { w=Math.round(w*maxDim/h); h=maxDim; }
      }
      const cv=document.createElement("canvas"); cv.width=w; cv.height=h;
      cv.getContext("2d").drawImage(img,0,0,w,h);
      cv.toBlob(b=>{ URL.revokeObjectURL(url); b?resolve(b):reject(new Error("compress-failed")); }, "image/jpeg", quality);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("load-failed")); };
    img.src = url;
  });
}
async function uploadProductImage(file, productId){
  const blob = await compressImage(file);
  const path = `products/${productId||"new"}_${Date.now()}.jpg`;
  const snap = await storage.ref().child(path).put(blob, {contentType:"image/jpeg"});
  return snap.ref.getDownloadURL();
}

async function resolveRole(u){

    if(d.exists) return d.data().role==="manager" ? "manager" : "assistant";
  }catch(e){}
  return "user";
}

}

function closeModal(){ $("#modal").innerHTML=""; }

/* =====================================================================
   6) الاحداث
   ===================================================================== */
const val = id => { const e=$("#"+id); return e ? e.value.trim() : ""; };
const A = {
  go(d){ S.view=d.v; S.drawer=false; render(); scrollTo(0,0); },
  drawer(){ S.drawer=!S.drawer; render(); },
  openSettings(){ S.view="settings"; S.tab="account"; S.drawer=false; render(); scrollTo(0,0); },
  tab(d){ S.tab=d.t; render(); },
  cat(d){ S.cat=d.id; render(); },
  authMode(d){ S.authMode=d.m; S.authMsg=null; render(); },
  mClose(d,e){ if(e.target.dataset.act==="mClose") closeModal(); },

  async doLogin(){
    const email=val("a_email"), pass=$("#a_pass").value;
    if(!email||!pass){ S.authMsg={t:"err",m:"اكتب الايميل وكلمة السر."}; return render(); }
    try{ await auth.signInWithEmailAndPassword(email,pass); }catch(e){ S.authMsg={t:"err",m:errMsg(e)}; render(); }
  },
  async doRegister(){
    const name=val("a_name"), email=val("a_email"), p1=$("#a_pass").value, p2=$("#a_pass2").value;
    if(!name||!email||!p1){ S.authMsg={t:"err",m:"عبي كل الحقول."}; return render(); }
    if(p1.length<8){ S.authMsg={t:"err",m:"كلمة السر لازم 8 خانات على الاقل."}; return render(); }
    if(p1!==p2){ S.authMsg={t:"err",m:"كلمتا السر غير متطابقتين."}; return render(); }
    try{
      const c = await auth.createUserWithEmailAndPassword(email,p1);
      await c.user.updateProfile({displayName:name});
      await db.collection("users").doc(c.user.uid).set({email:c.user.email,name,phone:"",createdAt:ts()});
    }catch(e){ S.authMsg={t:"err",m:errMsg(e)}; render(); }
  },
  async doReset(){
    const email = S.user ? S.user.email : val("a_email");
    if(!email){ S.authMsg={t:"err",m:"اكتب ايميلك اول شي."}; return render(); }
    try{ await auth.sendPasswordResetEmail(email); if(S.user) toast("تم ارسال الرابط لايميلك"); else { S.authMsg={t:"ok",m:"ارسلنا رابط تغيير كلمة السر لايميلك."}; render(); } }
    catch(e){ if(S.user) toast(errMsg(e)); else { S.authMsg={t:"err",m:errMsg(e)}; render(); } }
  },
  async resendVerify(){ try{ await S.user.sendEmailVerification(); toast("تم ارسال رسالة التفعيل"); }catch(e){ toast(errMsg(e)); } },
  async install(){ if(!window._dip) return; window._dip.prompt(); await window._dip.userChoice; window._dip=null; S.canInstall=false; render(); },
  async logout(){ S.drawer=false; S.view="home"; await auth.signOut(); },
  async saveName(){
    const n=val("s_name"); if(!n) return;
    try{ await S.user.updateProfile({displayName:n}); await db.collection("users").doc(S.user.uid).set({email:S.user.email,name:n,phone:"",createdAt:ts()},{merge:true}); toast("تم الحفظ"); render(); }catch(e){ toast(errMsg(e)); }
  },
  async sendReport(){
    const m=val("r_msg"); if(m.length<5) return toast("اكتب تفاصيل اكثر");
    try{ await db.collection("reports").add({uid:S.user.uid,email:S.user.email,message:m,status:"open",createdAt:ts()}); $("#r_msg").value=""; toast("تم ارسال البلاغ، شكرا لك"); }catch(e){ toast(errMsg(e)); }
  },

  /* السلة */
  addCart(d){ const i=S.cart.find(x=>x.id===d.id); if(i) i.qty++; else S.cart.push({id:d.id,qty:1}); saveCart(); toast("تمت الاضافة للسلة"); render(); },
  qty(d){ const i=S.cart.find(x=>x.id===d.id); if(!i) return; i.qty+=Number(d.d); if(i.qty<1) S.cart=S.cart.filter(x=>x!==i); saveCart(); render(); },
  rmCart(d){ S.cart=S.cart.filter(x=>x.id!==d.id); saveCart(); render(); },
  async checkout(){
    const name=val("c_name"), phone=val("c_phone"), addr=val("c_addr"), note=val("c_note");
    if(!name||!phone||!addr) return toast("عبي الاسم والهاتف والعنوان");
    const items=cartItems(); if(!items.length) return;
    const total=items.reduce((a,i)=>a+i.p.price*i.qty,0);
    const order={uid:S.user.uid,email:S.user.email,name,phone,address:addr,note,total,status:"جديد",createdAt:ts(),
      items:items.map(i=>({id:i.id,name:i.p.name,price:i.p.price,qty:i.qty}))};
    try{
      const ref=await db.collection("orders").add(order);
      const txt=`طلب جديد #${ref.id.slice(0,6).toUpperCase()}\nالاسم: ${name}\nالهاتف: ${phone}\nالعنوان: ${addr}\n\n`+
        order.items.map(i=>`- ${i.name} x${i.qty} = ${fmt(i.price*i.qty)}`).join("\n")+`\n\nالمجموع: ${fmt(total)} ${S.settings.currency}`;
      S.cart=[]; saveCart(); S.view="orders"; render();
      openModal(`<h3>تم استلام طلبك</h3><p style="color:var(--mu);margin-bottom:14px">لتسريع التجهيز، اكد طلبك بارساله على واتساب.</p>
        <div class="m-act"><a class="btn wa" target="_blank" rel="noopener" href="${waLink(S.settings.whatsapp,txt)}" data-act="mClose">تأكيد عبر واتساب</a><button class="btn ghost" data-act="mClose">لاحقا</button></div>`);
    }catch(e){ toast(errMsg(e)); }
  },

  /* المنتجات */
  editProduct(d){
    const p=S.products.find(x=>x.id===d.id)||{name:"",price:"",stock:1,image:"",description:"",category:"",active:true};
    S._imgFile=null; S._imgUrl=p.image||"";
    openModal(`<h3>${d.id?"تعديل منتج":"منتج جديد"}</h3>
    <div class="fld"><label>صورة المنتج</label>
      <div id="p_img_prev" class="thumb" style="width:100%;height:170px;border-radius:12px">${safeImg(p.image)?`<img src="${esc(p.image)}" alt="" referrerpolicy="no-referrer">`:ic("box")}</div>
      <div class="m-act" style="margin-top:8px">
        <label class="btn sm ghost" style="flex:1;cursor:pointer">اختر صورة من الجهاز<input type="file" accept="image/*" id="p_img_file" style="display:none"></label>
        <button type="button" class="btn sm danger" data-act="clearProductImg">إزالة الصورة</button>
      </div>
    </div>
    <div class="fld"><label>اسم المنتج</label><input class="in" id="p_name" value="${esc(p.name)}"></div>
    <div class="row2"><div class="fld"><label>السعر</label><input class="in" id="p_price" type="number" min="0" value="${esc(p.price)}"></div>
    <div class="fld"><label>الكمية بالمخزون</label><input class="in" id="p_stock" type="number" min="0" value="${esc(p.stock)}"></div></div>
    <div class="fld"><label>القسم</label><select class="in" id="p_cat"><option value="">بدون قسم</option>${S.cats.map(c=>`<option value="${c.id}" ${c.id===p.category?"selected":""}>${esc(c.name)}</option>`).join("")}</select></div>
    <div class="fld"><label>الوصف</label><textarea class="in" id="p_desc">${esc(p.description)}</textarea></div>
    <div class="fld"><label><input type="checkbox" id="p_act" ${p.active!==false?"checked":""}> ظاهر للزبائن</label></div>
    <div class="m-act"><button class="btn" id="p_save_btn" data-act="saveProduct" data-id="${esc(d.id||"")}">حفظ</button><button class="btn ghost" data-act="mClose">الغاء</button></div>`);
    $("#p_img_file").addEventListener("change", e=>{
      const f=e.target.files[0]; if(!f) return;
      if(!f.type.startsWith("image/")) return toast("اختر ملف صورة فقط");
      if(f.size > 15*1024*1024) return toast("حجم الصورة كبير جدا");
      S._imgFile=f;
      $("#p_img_prev").innerHTML = `<img src="${URL.createObjectURL(f)}" alt="">`;
    });
  },
  clearProductImg(){ S._imgFile=null; S._imgUrl=""; $("#p_img_prev").innerHTML = ic("box"); },
  async saveProduct(d){
    const name=val("p_name"), price=Number(val("p_price")), stock=Number(val("p_stock"));
    if(!name||isNaN(price)||price<0) return toast("اكتب الاسم والسعر");
    const btn=$("#p_save_btn"); const oldTxt=btn.textContent;
    try{
      let image = S._imgUrl || "";
      if(S._imgFile){
        btn.textContent="جاري رفع الصورة..."; btn.disabled=true;
        image = await uploadProductImage(S._imgFile, d.id);
      }
      const data={name,price,stock:isNaN(stock)?0:stock,category:$("#p_cat").value,image,description:val("p_desc"),active:$("#p_act").checked};
      if(d.id) await db.collection("products").doc(d.id).update(data);
      else await db.collection("products").add({...data,createdAt:ts()});
      closeModal(); toast("تم الحفظ");
    }catch(e){ btn.textContent=oldTxt; btn.disabled=false; toast(errMsg(e)); }
  },
  async delProduct(d){ if(confirm("حذف هذا المنتج؟")) try{ await db.collection("products").doc(d.id).delete(); toast("تم الحذف"); }catch(e){ toast(errMsg(e)); } },

  /* الاقسام */
  editCat(d){
    const c=S.cats.find(x=>x.id===d.id)||{name:"",order:S.cats.length+1};
    openModal(`<h3>${d.id?"تعديل قسم":"قسم جديد"}</h3><div class="fld"><label>اسم القسم</label><input class="in" id="k_name" value="${esc(c.name)}"></div>
    <div class="fld"><label>الترتيب</label><input class="in" id="k_ord" type="number" value="${esc(c.order)}"></div>
    <div class="m-act"><button class="btn" data-act="saveCat" data-id="${esc(d.id||"")}">حفظ</button><button class="btn ghost" data-act="mClose">الغاء</button></div>`);
  },
  async saveCat(d){
    const name=val("k_name"); if(!name) return toast("اكتب اسم القسم");
    const data={name,order:Number(val("k_ord"))||0};
    try{ if(d.id) await db.collection("categories").doc(d.id).update(data); else await db.collection("categories").add(data); closeModal(); toast("تم الحفظ"); }catch(e){ toast(errMsg(e)); }
  },
  async delCat(d){ if(confirm("حذف هذا القسم؟")) try{ await db.collection("categories").doc(d.id).delete(); }catch(e){ toast(errMsg(e)); } },

  async closeReport(d){ try{ await db.collection("reports").doc(d.id).update({status:"closed"}); }catch(e){ toast(errMsg(e)); } },

  /* الفريق */
  async addStaff(){
    const mail=val("t_mail").toLowerCase(), role=$("#t_role").value;
    if(!/^\S+@\S+\.\S+$/.test(mail)) return toast("اكتب ايميل صحيح");
    if(mail===ADMIN_EMAIL) return toast("هذا ايميل المسؤول الرئيسي");
    try{
      const q=await db.collection("users").where("email","==",mail).limit(1).get();
      if(q.empty) return toast("هذا الشخص ما مسجل بالتطبيق، خله يسجل حساب اول");
      await db.collection("staff").doc(q.docs[0].id).set({role,email:mail,addedAt:ts()});
      toast("تمت الاضافة"); $("#t_mail").value="";
    }catch(e){ toast(errMsg(e)); }
  },
  async delStaff(d){ if(confirm("ازالة هذا الشخص من الفريق؟")) try{ await db.collection("staff").doc(d.id).delete(); }catch(e){ toast(errMsg(e)); } },

  /* اعدادات المتجر */
  async saveStore(){
    const data={storeName:val("st_name")||DEFAULT_SETTINGS.storeName,currency:val("st_cur")||"د.ع",tagline:val("st_tag"),heroTitle:val("st_ht"),heroText:val("st_hx"),
      whatsapp:val("st_wa")||DEFAULT_WA,supportPhone:val("st_sp")||DEFAULT_WA,primary:val("st_col")||"#F97316"};
    try{ await db.collection("settings").doc("store").set(data,{merge:true}); toast("تم حفظ الإعدادات"); }catch(e){ toast(errMsg(e)); }
  }
};
const CHG = {
  async orderStatus(el){ try{ await db.collection("orders").doc(el.dataset.id).update({status:el.value}); toast("تم تحديث الحالة"); }catch(e){ toast(errMsg(e)); } }
};

document.addEventListener("click",e=>{
  const t=e.target.closest("[data-act]"); if(!t) return;
  if(e.target.closest("[data-stop]") && t.dataset.act==="mClose" && e.target===t.closest(".m-box")) return;
  const f=A[t.dataset.act]; if(f){ if(t.tagName!=="A") e.preventDefault(); f(t.dataset,e); }
});
document.addEventListener("change",e=>{ const t=e.target.closest("[data-chg]"); if(t && CHG[t.dataset.chg]) CHG[t.dataset.chg](t); });
document.addEventListener("input",e=>{ if(e.target.id==="q"){ S.q=e.target.value; const g=$("#grid"); if(g) g.innerHTML=productGrid(); } });
document.addEventListener("keydown",e=>{
  if(e.key==="Enter" && !S.user && configured && e.target.matches("#a_email,#a_pass,#a_pass2,#a_name")) (S.authMode==="register"?A.doRegister:A.doLogin)();
  if(e.key==="Escape") closeModal();
});

window.addEventListener("beforeinstallprompt",e=>{ e.preventDefault(); window._dip=e; S.canInstall=true; render(); });
if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  const swCode = `
    const V="mktab-v1";
    self.addEventListener("install",e=>{self.skipWaiting();});
    self.addEventListener("activate",e=>{e.waitUntil(caches.keys().then(k=>Promise.all(k.filter(x=>x!==V).map(x=>caches.delete(x)))).then(()=>self.clients.claim()));});
    self.addEventListener("fetch",e=>{
      const u=new URL(e.request.url);
      if(e.request.method!=="GET"||u.origin!==location.origin) return;
      e.respondWith(fetch(e.request).then(r=>{const c=r.clone();caches.open(V).then(x=>x.put(e.request,c));return r;}).catch(()=>caches.match(e.request)));
    });
  `;
  const swBlob = new Blob([swCode], {type:"application/javascript"});
  navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(()=>{});
}
applyTheme();
if(S.ready) render();
</script>
</body>
</html>
