<style>
:root{
  --orange:#FF7A00;
  --orange-d:#E86A00;
  --orange-l:#FFE3C7;
  --paper:#FFF4E6;
  --ink:#141414;
  --white:#fff;
  --green:#1FA855;
  --red:#D62828;
  --bw:3px;
  --shadow:5px 5px 0 var(--ink);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:'Tajawal',sans-serif;background:var(--paper);color:var(--ink);
  min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom));
  background-image:radial-gradient(var(--orange-l) 1.5px,transparent 1.5px);background-size:22px 22px;
}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:16px}
:focus-visible{outline:3px dashed var(--ink);outline-offset:2px}

/* ---------- Header ---------- */
.top{
  background:var(--orange);border-bottom:var(--bw) solid var(--ink);
  padding:calc(14px + env(safe-area-inset-top)) 16px 16px;position:sticky;top:0;z-index:20;
}
.brand{display:flex;align-items:center;gap:12px;max-width:1100px;margin:auto}
.logo{
  width:54px;height:54px;flex:none;background:var(--ink);color:var(--orange);
  border:var(--bw) solid var(--ink);border-radius:14px;display:grid;place-items:center;
  overflow:hidden;box-shadow:3px 3px 0 var(--white);
}
.logo img{width:100%;height:100%;display:block}
.brand h1{margin:0;font-family:'Cairo';font-weight:900;font-size:clamp(24px,6vw,34px);line-height:1.1;color:var(--ink)}
.brand small{display:block;font-weight:700;font-size:13px;color:var(--ink);opacity:.8}
.sync{margin-inline-start:auto;font-size:12px;font-weight:800;background:var(--white);border:2px solid var(--ink);
  border-radius:99px;padding:3px 10px;white-space:nowrap}
.sync i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);margin-inline-end:5px}
.sync.off i{background:#999}

.wrap{max-width:1100px;margin:auto;padding:16px}
.search{
  display:flex;gap:8px;align-items:center;background:var(--white);border:var(--bw) solid var(--ink);
  border-radius:14px;padding:4px 12px;box-shadow:var(--shadow);margin-bottom:16px
}
.search input{flex:1;border:0;outline:0;padding:11px 4px;background:transparent;min-width:0}

.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:none;background:var(--white);border:var(--bw) solid var(--ink);border-radius:99px;
  padding:8px 18px;font-weight:800;font-size:15px;color:var(--ink)
}
.chip.on{background:var(--ink);color:var(--orange)}

/* ---------- Products ---------- */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr);gap:18px}}
@media(min-width:960px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{
  background:var(--white);border:var(--bw) solid var(--ink);border-radius:18px;overflow:hidden;
  box-shadow:var(--shadow);display:flex;flex-direction:column;position:relative;
  transition:transform .12s, box-shadow .12s;cursor:pointer
}
.card:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--ink)}
.card .pic{aspect-ratio:1/1;background:var(--orange-l);border-bottom:var(--bw) solid var(--ink);display:grid;place-items:center;overflow:hidden}
.card .pic img{width:100%;height:100%;object-fit:cover;display:block}
.card .pic .ph{font-size:54px}
.card .info{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.card h3{margin:0;font-size:16px;font-weight:800;line-height:1.35;min-height:2.7em}
.price{font-family:'Cairo';font-weight:900;font-size:19px;color:var(--orange-d)}
.price small{font-size:12px;color:var(--ink);font-weight:700}
.tag{position:absolute;top:8px;inset-inline-start:8px;background:var(--ink);color:var(--white);font-size:12px;font-weight:800;padding:3px 10px;border-radius:99px}
.btn{
  border:var(--bw) solid var(--ink);border-radius:12px;padding:10px 14px;font-weight:800;font-size:15px;
  background:var(--orange);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:8px;
  box-shadow:3px 3px 0 var(--ink);text-decoration:none;transition:transform .1s, box-shadow .1s
}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.wa{background:#25D366}
.btn.dark{background:var(--ink);color:var(--orange);box-shadow:3px 3px 0 var(--orange)}
.btn.white{background:var(--white)}
.btn.red{background:var(--red);color:#fff}
.btn.block{width:100%}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:10px;box-shadow:2px 2px 0 var(--ink)}
.empty{text-align:center;padding:50px 20px;border:var(--bw) dashed var(--ink);border-radius:18px;background:var(--white);font-weight:700}
.empty b{display:block;font-size:44px;margin-bottom:6px}

/* ---------- Bottom nav ---------- */
.nav{
  position:fixed;bottom:0;inset-inline:0;background:var(--ink);z-index:30;
  padding:8px 14px calc(8px + env(safe-area-inset-bottom));display:flex;gap:10px;justify-content:center;
  border-top:var(--bw) solid var(--ink)
}
.nav button{
  flex:1;max-width:220px;background:transparent;border:2px solid transparent;color:#fff;border-radius:12px;
  padding:8px;font-weight:800;font-size:14px;display:flex;flex-direction:column;align-items:center;gap:2px
}
.nav button span{font-size:22px}
.nav button.on{background:var(--orange);color:var(--ink);border-color:var(--white)}
.nav .buy{background:#25D366;color:var(--ink)}

/* ---------- Modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(20,20,20,.65);z-index:50;display:none;align-items:flex-end;justify-content:center}
.overlay.show{display:flex}
.sheet{
  background:var(--paper);border:var(--bw) solid var(--ink);border-bottom:0;border-radius:24px 24px 0 0;
  width:100%;max-width:640px;max-height:92vh;overflow-y:auto;padding:18px 18px calc(24px + env(safe-area-inset-bottom));
  animation:up .22s ease-out
}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@media(prefers-reduced-motion:reduce){.sheet{animation:none}}
@media(min-width:700px){.overlay{align-items:center}.sheet{border-radius:24px;border-bottom:var(--bw) solid var(--ink)}}
.sheet .x{float:inline-end}
.sheet h2{font-family:'Cairo';font-weight:900;margin:0 0 12px;font-size:24px}
.big-pic{border:var(--bw) solid var(--ink);border-radius:16px;overflow:hidden;background:var(--orange-l);aspect-ratio:4/3;display:grid;place-items:center;margin-bottom:12px}
.big-pic img{width:100%;height:100%;object-fit:contain;background:#fff}
.desc{white-space:pre-wrap;line-height:1.8;background:var(--white);border:2px solid var(--ink);border-radius:12px;padding:10px 12px;margin:10px 0 14px}

/* ---------- Settings ---------- */
.panel{background:var(--white);border:var(--bw) solid var(--ink);border-radius:18px;padding:16px;box-shadow:var(--shadow);margin-bottom:18px}
.panel h2{margin:0 0 10px;font-family:'Cairo';font-weight:900;font-size:21px;display:flex;align-items:center;gap:8px}
.panel h2::before{content:"";width:12px;height:24px;background:var(--orange);border:2px solid var(--ink);border-radius:4px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1;min-width:140px}
.muted{opacity:.75;font-size:14px;line-height:1.7}

/* ---------- Forms ---------- */
label{display:block;font-weight:800;margin:10px 0 5px;font-size:14px}
.in{width:100%;border:var(--bw) solid var(--ink);border-radius:12px;padding:11px 12px;background:var(--white);outline:0}
.in:focus{box-shadow:3px 3px 0 var(--orange)}
textarea.in{min-height:90px;resize:vertical}

/* ---------- Admin ---------- */
.tabs{display:flex;gap:8px;margin:0 0 14px;flex-wrap:wrap}
.tabs button{flex:1;border:var(--bw) solid var(--ink);border-radius:12px;background:var(--white);padding:9px;font-weight:800}
.tabs button.on{background:var(--orange)}
.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;gap:10px;align-items:center;background:var(--white);border:2px solid var(--ink);border-radius:14px;padding:8px}
.item img,.item .th{width:56px;height:56px;border-radius:10px;border:2px solid var(--ink);object-fit:cover;flex:none;background:var(--orange-l);display:grid;place-items:center;font-size:24px}
.item .t{flex:1;min-width:0}
.item .t b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .t small{opacity:.75}
.img-prev{width:110px;height:110px;border:var(--bw) solid var(--ink);border-radius:14px;object-fit:cover;display:block;margin-top:8px;background:var(--orange-l)}
.toast{
  position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--orange);
  border:2px solid var(--orange);padding:10px 20px;border-radius:99px;font-weight:800;z-index:99;display:none;max-width:90vw;text-align:center
}
.toast.show{display:block}
.pin{letter-spacing:12px;text-align:center;font-size:26px;font-weight:800}
.foot{text-align:center;font-size:13px;opacity:.7;margin-top:24px}
</style>
</head>

const fmt = n=>Number(n||0).toLocaleString('en');
function intl(num){ // 0774... -> 964774...
  let n=String(num).replace(/\D/g,"");
  if(n.startsWith("00")) n=n.slice(2);
  if(n.startsWith("0")) n="964"+n.slice(1);
  return n;
}
function waLink(num,text){return `https://wa.me/${intl(num)}?text=${encodeURIComponent(text||"")}`}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("show"),2200)}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}

/* ---------- طبقة البيانات (أونلاين / محلي) ---------- */
const LS="mm_store_v1";
function loadLocal(){
  try{const d=JSON.parse(localStorage.getItem(LS)||"null"); if(d){state.cats=d.cats||[];state.products=d.products||[];state.settings={...state.settings,...(d.settings||{})}}}catch(e){}
}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify({cats:state.cats,products:state.products,settings:state.settings}))}catch(e){toast("المساحة ممتلئة، صغّر الصور")}}

async function initData(){
  loadLocal();
  if(FIREBASE_CONFIG && window.firebase){
    try{
      firebase.initializeApp(FIREBASE_CONFIG);
      db=firebase.firestore(); auth=firebase.auth(); cloud=true;
      try{ db.enablePersistence({synchronizeTabs:true}).catch(()=>{}) }catch(e){}
      db.collection("categories").orderBy("ts").onSnapshot(s=>{state.cats=s.docs.map(d=>({id:d.id,...d.data()}));saveLocal();render()});
      db.collection("products").orderBy("ts","desc").onSnapshot(s=>{state.products=s.docs.map(d=>({id:d.id,...d.data()}));saveLocal();render()});
      db.collection("settings").doc("main").onSnapshot(d=>{if(d.exists){state.settings={...state.settings,...d.data()};saveLocal();render()}});
      auth.onAuthStateChanged(u=>{state.isAdmin=!!(u&&u.email===ADMIN_EMAIL)});
      const b=$("#syncBadge");b.classList.remove("off");b.querySelector("span").textContent="أونلاين";
    }catch(e){console.error(e);cloud=false;toast("تعذر الاتصال بـ Firebase، اشتغل محلياً")}
  }
}
async function dbSaveCat(c){
  if(cloud){const {id,...rest}=c;await db.collection("categories").doc(id).set(rest,{merge:true})}
  else{const i=state.cats.findIndex(x=>x.id===c.id);i<0?state.cats.push(c):state.cats[i]=c;saveLocal();render()}
}
async function dbDelCat(id){
  if(cloud){await db.collection("categories").doc(id).delete()}
  else{state.cats=state.cats.filter(c=>c.id!==id);saveLocal();render()}
}
async function dbSaveProd(p){
  if(cloud){const {id,...rest}=p;await db.collection("products").doc(id).set(rest,{merge:true})}
  else{const i=state.products.findIndex(x=>x.id===p.id);i<0?state.products.unshift(p):state.products[i]=p;saveLocal();render()}
}
async function dbDelProd(id){
  if(cloud){await db.collection("products").doc(id).delete()}
  else{state.products=state.products.filter(p=>p.id!==id);saveLocal();render()}
}
async function dbSaveSettings(s){
  if(cloud){await db.collection("settings").doc("main").set(s,{merge:true})}
  else{state.settings={...state.settings,...s};saveLocal();render()}
}

/* ---------- التنقل ---------- */
function go(v){
  state.view=v;
  $("#nHome").classList.toggle("on",v==="home");
  $("#nSet").classList.toggle("on",v==="settings");
  window.scrollTo({top:0});render();
}
function orderGeneral(){
  window.open(waLink(SHOP_WHATSAPP,`السلام عليكم، أريد الاستفسار عن سلعة من ${SHOP_NAME}`),"_blank");
}

/* ---------- العرض ---------- */
function render(){
  const app=$("#app");
  if(state.view==="settings"){app.innerHTML=settingsView()}
  else app.innerHTML=homeView();
  if(state.adminOpen) renderAdmin();
}
function homeView(){
  const cats=state.cats;
  let list=state.products.filter(p=>p.available!==false || true);
  if(state.cat!=="all") list=list.filter(p=>p.catId===state.cat);
  if(state.q.trim()) list=list.filter(p=>(p.name+" "+(p.desc||"")).toLowerCase().includes(state.q.trim().toLowerCase()));
  return `
  <div class="search"><span>🔍</span><input id="q" placeholder="ابحث عن سلعة..." value="${esc(state.q)}" oninput="state.q=this.value;renderGrid()"></div>
  <div class="chips">
    <button class="chip ${state.cat==="all"?"on":""}" onclick="setCat('all')">الكل</button>
    ${cats.map(c=>`<button class="chip ${state.cat===c.id?"on":""}" onclick="setCat('${c.id}')">${esc(c.name)}</button>`).join("")}
  </div>
  <div id="gridBox">${gridHTML(list)}</div>`;
}
function setCat(id){state.cat=id;render()}
function renderGrid(){
  let list=state.products;
  if(state.cat!=="all") list=list.filter(p=>p.catId===state.cat);
  if(state.q.trim()) list=list.filter(p=>(p.name+" "+(p.desc||"")).toLowerCase().includes(state.q.trim().toLowerCase()));
  $("#gridBox").innerHTML=gridHTML(list);
}
function gridHTML(list){
  if(!list.length){
    return `<div class="empty"><b>📦</b>${state.products.length?"ما لكينا سلعة بهذا البحث":"ماكو سلع بعد. المسؤول يكدر يضيفها من الإعدادات."}</div>`;
  }
  return `<div class="grid">${list.map(p=>{
    const cat=state.cats.find(c=>c.id===p.catId);
    return `<article class="card" onclick="openProduct('${p.id}')">
      ${p.available===false?'<span class="tag">نفذت</span>':''}
      <div class="pic">${p.img?`<img loading="lazy" src="${esc(p.img)}" alt="${esc(p.name)}">`:'<span class="ph">🔌</span>'}</div>
      <div class="info">
        <h3>${esc(p.name)}</h3>
        <div class="price">${fmt(p.price)} <small>${CURRENCY}</small></div>
        <a class="btn wa sm" href="${waLink(SHOP_WHATSAPP,`السلام عليكم، أريد شراء: ${p.name}\nالسعر: ${fmt(p.price)} ${CURRENCY}`)}" target="_blank" onclick="event.stopPropagation()">💬 اشتري واتساب</a>
      </div>
    </article>`}).join("")}</div>`;
}
function openProduct(id){
  const p=state.products.find(x=>x.id===id); if(!p)return;
  const cat=state.cats.find(c=>c.id===p.catId);
  const msg=`السلام عليكم، أريد شراء: ${p.name}\nالسعر: ${fmt(p.price)} ${CURRENCY}`;
  openSheet(`
    <button class="btn white sm x" onclick="closeSheet()">✕ إغلاق</button>
    <h2>${esc(p.name)}</h2>
    <div class="big-pic">${p.img?`<img src="${esc(p.img)}" alt="">`:'<span style="font-size:70px">🔌</span>'}</div>
    <div class="price" style="font-size:28px">${fmt(p.price)} <small>${CURRENCY}</small></div>
    ${cat?`<div class="muted">القسم: ${esc(cat.name)}</div>`:""}
    ${p.available===false?'<div class="muted" style="color:var(--red);font-weight:800">هذي السلعة نفذت حالياً — استفسر إذا راح ترجع</div>':""}
    ${p.desc?`<div class="desc">${esc(p.desc)}</div>`:""}
    <a class="btn wa block" href="${waLink(SHOP_WHATSAPP,msg)}" target="_blank">💬 اشتري عن طريق واتساب</a>
  `);
}
function openSheet(html){ $("#sheet").innerHTML=html; $("#ov").classList.add("show"); }
function closeSheet(){ $("#ov").classList.remove("show"); state.adminOpen=false; }
$("#ov").addEventListener("click",e=>{if(e.target.id==="ov")closeSheet()});

/* ---------- الإعدادات ---------- */
function settingsView(){
  const s=state.settings;
  return `
  <section class="panel">
    <h2>الدعم والاستفسار</h2>
    <p class="muted">للاستفسار أو الشكوى تواصل مع المدير مباشرة:</p>
    <div class="row">
      <a class="btn wa" href="${waLink(s.managerPhone,'السلام عليكم، أريد الاستفسار من المدير')}" target="_blank">💬 واتساب المدير</a>
      <a class="btn dark" href="tel:${esc(s.managerPhone)}">📞 اتصال بالمدير</a>
    </div>
    <p style="font-weight:800;margin:12px 0 0;direction:ltr;text-align:right">${esc(s.managerPhone)}</p>
  </section>

  <section class="panel">
    <h2>للشراء</h2>
    <p class="muted">تريد تشتري سلعة؟ اضغط وراسلنا على واتساب:</p>
    <a class="btn wa block" href="${waLink(SHOP_WHATSAPP,'السلام عليكم، أريد شراء سلعة')}" target="_blank">💬 ${esc(SHOP_WHATSAPP)}</a>
  </section>

  ${s.address?`<section class="panel"><h2>عنوان المحل</h2><p style="margin:0;line-height:1.8">${esc(s.address)}</p></section>`:""}

  <section class="panel">
    <h2>قسم المسؤول</h2>
    <p class="muted">إضافة الأقسام والسلع وتعديلها — بالرمز السري فقط.</p>
    <button class="btn dark block" onclick="askAdmin()">🔒 دخول المسؤول</button>
  </section>
  <div class="foot">${SHOP_NAME} © ${new Date().getFullYear()}</div>`;
}

/* ---------- دخول المسؤول ---------- */
function askAdmin(){
  if(state.isAdmin){openAdmin();return}
  openSheet(`
    <button class="btn white sm x" onclick="closeSheet()">✕</button>
    <h2>🔒 دخول المسؤول</h2>
    <p class="muted">اكتب الرمز السري:</p>
    <input id="pin" class="in pin" type="password" inputmode="numeric" maxlength="12" autocomplete="off" placeholder="••••••" onkeydown="if(event.key==='Enter')checkPin()">
    <button class="btn block" style="margin-top:14px" onclick="checkPin()">دخول</button>`);
  setTimeout(()=>$("#pin")&&$("#pin").focus(),100);
}
async function checkPin(){
  const v=$("#pin").value.trim();
  if(cloud){
    try{await auth.signInWithEmailAndPassword(ADMIN_EMAIL,v);state.isAdmin=true;openAdmin();toast("أهلاً بيك يا مسؤول ✅")}
    catch(e){toast("الرمز غلط ❌");$("#pin").value=""}
  }else{
    if(v===ADMIN_CODE){state.isAdmin=true;openAdmin();toast("أهلاً بيك يا مسؤول ✅")}
    else{toast("الرمز غلط ❌");$("#pin").value=""}
  }
}
async function adminLogout(){ if(cloud){try{await auth.signOut()}catch(e){}} state.isAdmin=false; closeSheet(); toast("تم تسجيل الخروج"); }

/* ---------- لوحة المسؤول ---------- */
let draftImg="";
function openAdmin(){ state.adminOpen=true; state.tab=state.tab||"cats"; $("#ov").classList.add("show"); renderAdmin(); }
function renderAdmin(){
  if(!state.isAdmin){closeSheet();return}
  const t=state.tab;
  let body="";
  if(t==="cats") body=adminCats();
  else if(t==="prods") body=adminProds();
  else body=adminSettings();
  $("#sheet").innerHTML=`
    <button class="btn white sm x" onclick="closeSheet()">✕ إغلاق</button>
    <h2>لوحة المسؤول</h2>
    <div class="tabs">
      <button class="${t==="cats"?"on":""}" onclick="state.tab='cats';renderAdmin()">الأقسام</button>
      <button class="${t==="prods"?"on":""}" onclick="state.tab='prods';draftImg='';renderAdmin()">السلع</button>
      <button class="${t==="set"?"on":""}" onclick="state.tab='set';renderAdmin()">الإعدادات</button>
    </div>
    ${body}
    <button class="btn red block" style="margin-top:18px" onclick="adminLogout()">تسجيل خروج</button>`;
}

/* الأقسام */
function adminCats(){
  return `
    <label>اسم قسم جديد</label>
    <div class="row" style="flex-wrap:nowrap">
      <input id="catName" class="in" placeholder="مثال: هواتف، شواحن، كاميرات">
      <button class="btn" style="flex:none;min-width:0" onclick="addCat()">إضافة</button>
    </div>
    <label style="margin-top:18px">الأقسام الحالية (${state.cats.length})</label>
    <div class="list">
    ${state.cats.length?state.cats.map(c=>`
      <div class="item"><div class="th">📁</div>
        <div class="t"><b>${esc(c.name)}</b><small>${state.products.filter(p=>p.catId===c.id).length} سلعة</small></div>
        <button class="btn sm white" onclick="renameCat('${c.id}')">✏️</button>
        <button class="btn sm red" onclick="delCat('${c.id}')">🗑</button>
      </div>`).join(""):'<div class="empty">ماكو أقسام. أضف أول قسم.</div>'}
    </div>`;
}
async function addCat(){
  const n=$("#catName").value.trim(); if(!n)return toast("اكتب اسم القسم");
  await dbSaveCat({id:uid(),name:n,ts:Date.now()}); toast("تمت إضافة القسم ✅");
}
async function renameCat(id){
  const c=state.cats.find(x=>x.id===id); const n=prompt("الاسم الجديد:",c.name); if(!n||!n.trim())return;
  await dbSaveCat({...c,name:n.trim()}); toast("تم التعديل ✅");
}
async function delCat(id){
  const n=state.products.filter(p=>p.catId===id).length;
  if(!confirm(n?`هذا القسم فيه ${n} سلعة، السلع راح تبقى بدون قسم. تحذف القسم؟`:"تحذف هذا القسم؟"))return;
  await dbDelCat(id); if(state.cat===id)state.cat="all"; toast("تم الحذف");
}

/* السلع */
function adminProds(){
  return `
    <button class="btn block" onclick="prodForm()">➕ إضافة سلعة جديدة</button>
    <label style="margin-top:18px">السلع الحالية (${state.products.length})</label>
    <div class="list">
    ${state.products.length?state.products.map(p=>`
      <div class="item">
        ${p.img?`<img src="${esc(p.img)}" alt="">`:'<div class="th">🔌</div>'}
        <div class="t"><b>${esc(p.name)}</b><small>${fmt(p.price)} ${CURRENCY}${p.available===false?" — نفذت":""}</small></div>
        <button class="btn sm white" onclick="prodForm('${p.id}')">✏️</button>
        <button class="btn sm red" onclick="delProd('${p.id}')">🗑</button>
      </div>`).join(""):'<div class="empty">ماكو سلع. اضغط إضافة سلعة.</div>'}
    </div>`;
}
function prodForm(id){
  if(!state.cats.length){toast("أضف قسم أول شي");state.tab="cats";renderAdmin();return}
  const p=id?state.products.find(x=>x.id===id):{name:"",price:"",catId:state.cats[0].id,desc:"",img:"",available:true};
  draftImg=p.img||"";
  $("#sheet").innerHTML=`
    <button class="btn white sm x" onclick="renderAdmin()">↩ رجوع</button>
    <h2>${id?"تعديل سلعة":"سلعة جديدة"}</h2>
    <label>اسم السلعة</label><input id="pName" class="in" value="${esc(p.name)}">
    <div class="row">
      <div><label>السعر (${CURRENCY})</label><input id="pPrice" class="in" inputmode="numeric" value="${esc(p.price)}"></div>
      <div><label>القسم</label><select id="pCat" class="in">${state.cats.map(c=>`<option value="${c.id}" ${c.id===p.catId?"selected":""}>${esc(c.name)}</option>`).join("")}</select></div>
    </div>
    <label>الوصف (اختياري)</label><textarea id="pDesc" class="in">${esc(p.desc||"")}</textarea>
    <label>الصورة</label>
    <input id="pFile" type="file" accept="image/*" class="in" onchange="pickImg(this)">
    <img id="pPrev" class="img-prev" style="${draftImg?"":"display:none"}" src="${esc(draftImg)}" alt="">
    <label style="display:flex;gap:8px;align-items:center;margin-top:14px"><input id="pAv" type="checkbox" ${p.available!==false?"checked":""} style="width:22px;height:22px"> متوفرة</label>
    <button class="btn block" style="margin-top:16px" onclick="saveProd('${id||""}')">💾 حفظ</button>`;
}
function pickImg(inp){
  const f=inp.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=e=>{
    const im=new Image();
    im.onload=()=>{
      const M=720, k=Math.min(1,M/Math.max(im.width,im.height));
      const c=document.createElement("canvas"); c.width=Math.round(im.width*k); c.height=Math.round(im.height*k);
      const x=c.getContext("2d"); x.fillStyle="#fff"; x.fillRect(0,0,c.width,c.height); x.drawImage(im,0,0,c.width,c.height);
      draftImg=c.toDataURL("image/jpeg",0.72);
      const pv=$("#pPrev"); pv.src=draftImg; pv.style.display="block";
    };
    im.src=e.target.result;
  };
  r.readAsDataURL(f);
}
async function saveProd(id){
  const name=$("#pName").value.trim(), price=Number($("#pPrice").value.replace(/[^\d.]/g,""));
  if(!name)return toast("اكتب اسم السلعة");
  if(!price&&price!==0)return toast("اكتب السعر");
  const old=id?state.products.find(x=>x.id===id):null;
  const p={id:id||uid(),name,price,catId:$("#pCat").value,desc:$("#pDesc").value.trim(),img:draftImg||"",available:$("#pAv").checked,ts:old?old.ts:Date.now()};
  try{await dbSaveProd(p);toast("تم الحفظ ✅");renderAdmin()}catch(e){console.error(e);toast("فشل الحفظ: "+(e.code||"خطأ"))}
}
async function delProd(id){ if(!confirm("تحذف هذي السلعة؟"))return; await dbDelProd(id); toast("تم الحذف"); }

/* إعدادات المسؤول */
function adminSettings(){
  const s=state.settings;
  return `
    <label>رقم المدير (يظهر في قسم الدعم)</label>
    <input id="sMgr" class="in" inputmode="tel" style="direction:ltr;text-align:right" value="${esc(s.managerPhone)}">
    <label>عنوان المحل (اختياري)</label>
    <input id="sAddr" class="in" value="${esc(s.address||"")}" placeholder="مثال: بغداد - الكرادة">
    <button class="btn block" style="margin-top:16px" onclick="saveSet()">💾 حفظ</button>
    <p class="muted" style="margin-top:14px">رقم الشراء ثابت: <b style="direction:ltr;display:inline-block">${esc(SHOP_WHATSAPP)}</b></p>`;
}
async function saveSet(){
  const m=$("#sMgr").value.trim(); if(!m)return toast("اكتب رقم المدير");
  await dbSaveSettings({managerPhone:m,address:$("#sAddr").value.trim()}); toast("تم الحفظ ✅");
}

/* ---------- ربط السيرفر أونلاين (Firebase Firestore) ---------- */

async function initData() {
  db.collection("cats").onSnapshot((snapshot) => {
    state.cats = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
    render();
  });

  db.collection("prods").onSnapshot((snapshot) => {
    state.products = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
    render();
  });

  db.collection("settings").doc("main").onSnapshot((doc) => {
    if (doc.exists) {
      state.settings = doc.data();
      render();
    }
  });
}

async function dbSaveProd(prod) {
  const id = prod.id || db.collection("prods").doc().id;
  prod.id = id;
  await db.collection("prods").doc(id).set(prod);
}

async function dbDelProd(id) {
  await db.collection("prods").doc(id).delete();
}

async function dbSaveCat(cat) {
  const id = cat.id || db.collection("cats").doc().id;
  cat.id = id;
  await db.collection("cats").doc(id).set(cat);
}

async function dbDelCat(id) {
  await db.collection("cats").doc(id).delete();
}

async function dbSaveSettings(settings) {
  await db.collection("settings").doc("main").set(settings, { merge: true });
}

/* ---------- تشغيل ---------- */
initData().then(render);
render();
</script>
